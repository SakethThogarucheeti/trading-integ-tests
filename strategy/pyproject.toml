[project]
name = "algo-strategy-testing"
version = "0.1.0"
description = "Strategy-layer integration tests for trading-platform: backtesting, Monte Carlo, walk-forward, and indicator validation, run against a real Postgres via testcontainers"
requires-python = ">=3.13"
dependencies = [
    "trading-platform",
    "plotly>=5.20",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "testcontainers[postgres]>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]

[tool.setuptools.packages.find]
include = ["testing*"]

[tool.uv]
package = true

[tool.uv.sources]
trading-platform = { path = "../../trading-platform", editable = true }
