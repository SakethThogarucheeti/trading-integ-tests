[project]
name = "algo-system-testing"
version = "0.1.0"
description = "End-to-end pipeline integration tests for trading-platform: signal -> risk filter -> order execution -> fill, against real Postgres via testcontainers"
requires-python = ">=3.13"
dependencies = [
    "trading-platform",
    "testcontainers[postgres]>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
pythonpath = ["."]

[tool.uv]
package = true

[tool.uv.sources]
trading-platform = { path = "../../trading-platform", editable = true }
